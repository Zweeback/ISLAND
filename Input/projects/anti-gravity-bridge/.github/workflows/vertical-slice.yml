name: Anti-Gravity Bridge Vertical Slice CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Input/projects/anti-gravity-bridge

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r orchestrator/requirements.txt
        pip install pytest httpx

    - name: Run Pytest
      run: |
        # Set paths so tests can locate orchestrator module and dry run configurations
        export PYTHONPATH=.
        export BLENDER_DRY_RUN=true
        export MESHROOM_DRY_RUN=true
        pytest tests/

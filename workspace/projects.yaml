  - id: anti-gravity-bridge
    path: Input/projects/anti-gravity-bridge
    status: canonical
    type: python-api
    description: >
      FastAPI orchestrator connecting Unity Editor, headless Blender,
      and Meshroom photogrammetry. Most complete codebase in the repo.
    language: [python, csharp]
    framework: [fastapi, pydantic]
    deployable: false
    install_command: pip install -r orchestrator/requirements.txt
    test_command: PYTHONPATH=. pytest
    source_repo: null
    source_status: present
    agent_permissions:
      read: true
      write: allowed
      deploy: false
      note: "P0 security PRs #53/#55 block any deployment"


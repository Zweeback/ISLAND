# ISLAND Workspace Project Catalog
# Single source of truth for all known projects.
# Validated against workspace/projects.schema.json in CI.
#
# Status values:
#   canonical     – primary, active, code present, tests run
#   active        – running / usable, may not be primary
#   experimental  – in development, unstable
#   placeholder   – directory created, source not yet imported
#   data-only     – no runnable code, only data/assets
#   docs-only     – documentation without runnable code
#   archived      – reference copy, do not modify
#   reference-only – external reference, read-only
#   unknown       – not yet classified

schema_version: "workspace.v1"
